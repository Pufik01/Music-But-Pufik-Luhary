[Build Options]
# Опции сборки для PyInstaller

[Application]
name = MusicButton
version = 1.0.0
description = Sound Pad - Воспроизведение звуков через системный аудиовыход
author = Your Name

[PyInstaller]
# Основные параметры
onedir = False  # Создать один EXE файл (True) или папку (False)
console = False  # Скрыть консольное окно
icon = icon.ico  # Иконка приложения (опционально)

# Дополнительные параметры
hiddenimports = 
    pygame
    pygame.mixer
    
# Исключения для уменьшения размера
excludes =
    tkinter.test
    pygame.tests
    
# Параметры для Windows
windows_options =
    --uac-admin  # Запрос прав администратора (если нужно)
    
[Distribution]
# Папка для готового дистрибутива
dist_folder = dist
build_folder = build

[Features]
# Поддерживаемые форматы
audio_formats = mp3, wav, ogg, flac

# Автозапуск (опционально)
auto_start = False
